<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111426"><title>Vaylox Admin</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 70% 0%,#3b2f72,transparent 42%),#111426;color:#f7f8ff;font:15px system-ui,sans-serif}.panel{width:min(460px,100%);padding:26px;background:#202642;border:1px solid #ffffff28;border-radius:18px;box-shadow:0 24px 80px #0008}.brand{font-size:25px;font-weight:1000}.brand span{color:#65e4e9}.muted{color:#b8c2dd;line-height:1.6}label{display:block;margin:15px 0 6px;font-weight:800}input{width:100%;padding:12px;border:1px solid #ffffff30;border-radius:10px;background:#11182d;color:white;font:inherit}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(110deg,#a58aff,#65e4e9);color:#111426;font-weight:900;font:inherit;cursor:pointer}.message{margin-top:13px;color:#ffd78a;min-height:22px}.verified{display:inline-block;padding:5px 9px;border-radius:99px;background:#1b725d;color:#a6ffdf;font-weight:900;font-size:12px}.hidden{display:none}.back{display:inline-block;margin-top:14px;color:#c9c3ff}</style></head><body><main class="panel"><div class="brand">◈ <span>vaylox</span></div><p class="muted">Geschützter Administrator-Zugang. Dieses Konto kann nicht über die öffentliche Registrierung erstellt werden.</p><section id="login"><h2>Admin-Anmeldung</h2><form id="form"><label for="username">Admin-Benutzername</label><input id="username" autocomplete="username" required><label for="password">Admin-Passwort</label><input id="password" type="password" autocomplete="current-password" required><button>Anmelden</button></form></section><section id="account" class="hidden"><h2>Admin-Konto</h2><p><b id="name"></b> <span class="verified">✓ VERIFIZIERT</span></p><p class="muted">Serverseitig bestätigtes Vaylox-Administratorkonto. Die Rolle wird vom Server vergeben.</p><button id="logout">Abmelden</button></section><div class="message" id="message" role="status"></div><a class="back" href="../index.html">← Zurück zu Vaylox</a></main><script>
const $=s=>document.querySelector(s),login=$('#login'),account=$('#account'),message=$('#message');
function show(a){login.classList.toggle('hidden',a);account.classList.toggle('hidden',!a)}
async function check(){try{const r=await fetch('/api/admin/me');if(r.ok){const d=await r.json();$('#name').textContent=d.account.username;show(true)}}catch{}}
$('#form').addEventListener('submit',async e=>{e.preventDefault();message.textContent='Prüfe Zugang …';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Anmeldung fehlgeschlagen.');$('#name').textContent=d.account.username;$('#password').value='';message.textContent='';show(true)}catch(err){message.textContent=err.message}});
$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});show(false);message.textContent='Du wurdest abgemeldet.'};check();
</script></body></html>
