<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaylox – Anmelden</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 80% 0%,#392b70,transparent 38%),#111426;color:#f7f8ff;font:15px system-ui}.card{width:min(100%,460px);padding:26px;background:#202642;border:1px solid #ffffff25;border-radius:20px}.brand{font-size:25px;font-weight:950}.brand span{color:#55d9e8}label{display:block;font-weight:750;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #ffffff25;border-radius:10px;background:#141a30;color:white;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:linear-gradient(110deg,#987cff,#55d9e8);color:#111426;font-weight:950;font:inherit;cursor:pointer}a{color:#c5b9ff}.muted{color:#aeb6d0;font-size:13px;line-height:1.5}.message{margin-top:14px;min-height:22px;color:#b5f3dc}</style></head><body><main class="card"><a class="brand" href="../index.html">◈ <span>vaylox</span></a><h1>Willkommen zurück</h1><p class="muted">Melde dich mit deinem Spielernamen oder deiner E-Mail-Adresse an.</p><form id="form"><label for="identity">E-Mail oder Spielername</label><input id="identity" autocomplete="username" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><button>Anmelden</button></form><p id="message" class="message" role="status"></p><p class="muted">Noch kein Konto? <a href="register.html">Jetzt registrieren</a></p><p><a href="../index.html">← Zurück zu Vaylox</a></p></main><script>
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#message');m.textContent='Anmeldung läuft …';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identity:document.querySelector('#identity').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Anmeldung fehlgeschlagen.');m.textContent='Angemeldet als '+d.account.username+'.';const next=new URLSearchParams(location.search).get('next')||'../index.html';if(next && !next.startsWith('//') && !next.includes('\\\\') && !next.startsWith('http:') && !next.startsWith('https:')) location.href=next.startsWith('/')?next:next}catch(err){m.textContent=err.message}});
</script></body></html>
