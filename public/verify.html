<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaylox – E-Mail bestätigen</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 80% 0%,#392b70,transparent 38%),#111426;color:#f7f8ff;font:15px system-ui}.card{width:min(100%,480px);padding:26px;background:#202642;border:1px solid #ffffff25;border-radius:20px}.brand{font-size:25px;font-weight:950}.brand span{color:#55d9e8}p{color:#b8c2dd;line-height:1.6}button,a{display:inline-block;margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(110deg,#987cff,#55d9e8);color:#111426;font-weight:900;text-decoration:none;cursor:pointer}.message{color:#b5f3dc}</style></head><body><main class="card"><a class="brand" href="../index.html">◈ <span>vaylox</span></a><h1>E-Mail bestätigen</h1><p>Mit einem Klick bestätigst du, dass du Zugriff auf diese E-Mail-Adresse hast.</p><button id="verify">E-Mail jetzt bestätigen</button><p id="message" class="message" role="status"></p></main><script>
const token=new URLSearchParams(location.search).get('token');const button=document.querySelector('#verify'),message=document.querySelector('#message');button.addEventListener('click',async()=>{button.disabled=true;message.textContent='Wird geprüft …';try{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Bestätigung fehlgeschlagen.');message.textContent=d.message+' Die normale Anmeldung wird im nächsten Schritt freigeschaltet.';button.textContent='Bestätigt'}catch(e){message.textContent=e.message;button.disabled=false}});
</script></body></html>
